name: Deploy

# Only from main. The Pages environment permits that branch and no other, and
# keeping the trigger in step with that rule means a push to a feature branch
# fails no jobs rather than failing one against a protection rule.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm ci --prefix recorder
          npm ci --prefix app

      # The app's build copies this out as a plain asset. Without it the page
      # deploys fine and none of what it demonstrates can be tried.
      - name: Build recorder
        run: npm run build --prefix recorder

      - name: Build app
        env:
          DEPLOY_BASE: /${{ github.event.repository.name }}/
        run: npm run build --prefix app

      - name: Fail if the recorder did not ship
        run: test -s app/dist/recorder.global.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
