name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: |
          npm ci
          npm ci --prefix recorder
          npm ci --prefix app

      - name: Typecheck
        run: npm run typecheck

      # Only Chromium: the suite tests selector resilience and replay
      # determinism, neither of which is engine-specific. Running three
      # browsers would triple CI time to re-prove the same thing.
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
